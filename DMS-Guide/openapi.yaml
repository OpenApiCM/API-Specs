                #   type: string
                withValetService:
                  description: Indica si la cita cuenta con servicio de valet a domicilio. / Indicates if an appointment has valet service.
                  type: boolean
                appointmentReasons:
                  description:
                    Arreglo con los motivos de la cita. / Array with the appointment's
                    reasons.
                  type: array
                  items:
                    properties:
                      appointmentReason:
                        description:
                          Descripción en ClearMechanic del motivo de la cita. / Description
                          of the appointment reason in ClearMechanic.
                        type: string
                notesByType:
                  description: Arreglo de notas clasificadas por tipo. / Array of notes classified by type.
                  type: array
                  items:
                    type: object
                    required:
                      - textNote
                      - isFromCustomer
                      - noteType
                    properties:
                      textNote:
                        description: Texto de la nota. / Note text.
                        type: string
                      isFromCustomer:
                        description: Indica si la nota proviene del cliente final. / Indicates if the note comes from the final customer.
                        type: boolean
                      noteType:
                        description: Tipo de nota. Puede ser 'ForCustomer' (para el cliente final) o 'ForInternal' (para uso interno). / Note type. Can be 'ForCustomer' (for the final customer) or 'ForInternal' (for internal use).
                        type: string
                        enum:
                          - ForCustomer
                          - ForInternal
                customReasons:
                  description: Arreglo de motivos de visita personalizables. / Array of custom reasons.
                  type: array
                  items:
                    type: object
                    required:
                      - reasonId
                    properties:
                      reasonId: 
                          description: Identificador del motivo de visita personalizable. / Custom reason identifier.
                          type: string
                      details:
                        nullable: true
                        type: array
                        items:
                          properties: 
                            detailId:
                              description: Identificador del detalle de motivo de visita personalizable. / Custom reason detail identifier.
