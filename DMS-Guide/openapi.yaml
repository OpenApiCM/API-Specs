                    Observaciones o comentarios sobre la cita. / Appointment's
                    observations or comments.
                  type: string
                serviceAdvisorId:
                  description:
                    Identificador en el software integrado del Asesor de Servicio que
                    atenderá la cita. / Integrated software identifier of the
                    Service Advisor who will take the appointment
