openapi: 3.0.2
info:
  title: Guía para desarrollar APIs de terceros compatibles con ClearMechanic
  description: Paso a paso para que desarrolladores externos creen APIs que se integren fácilmente con el ecosistema de ClearMechanic, asegurando una comunicación eficiente y segura entre plataformas.
  version: 4.0.0
  contact:
    email: openapi@clearcheck.us
servers:
  - url: https://{hostname}/api
    variables:
      hostname:
        default: hostname
tags:
  - name: Appointments
    description: Información sobre citas. / Appointments information.
  - name: Orders
    description: Información sobre Órdenes de Reparación. / ROs information.
  - name: Customers
    description: Información sobre Clientes Finales. / Final Customers information.
  - name: Vehicles
    description: Información sobre Vehículos. / Vehicles information.
  - name: Users
    description: Información sobre usuarios. / Users information.
  - name: Estimates
    description: Información sobre cotizaciones. / Estimates information.
  - name: Inventory Items
    description: Información sobre artículos de inventario. / Inventory Items information.
  - name: Quotes
    description: Información sobre cotizaciones. / Quotes information.
  - name: Workshop Planner
    description: Información sobre Planeador de Taller. / Workshop Planner information.
  - name: Tasks
    description: Información sobre tareas. / Tasks information.
  - name: Others
    description: Información general. / General information.
paths:
  /appointments:
    get:
      tags:
        - Appointments
      summary: Obtiene el listado de la(s) cita(s) / Returns a list of appointments.
      operationId: appointments
      description:
        Al llamado de este recurso se deben obtener datos relacionados a
        la(s) cita(s) de acuerdo a los valores proporcionados a través de los
        parámetros de la llamada. / When calling this resource, a list of
        appointments will be returned, according to the request parameters.
      parameters:
        - name: organizationId
          description:
            Identificador único de la agencia o taller de la cual se quiere
            obtener la información. / Unique identifier of the dealership or
            workshop.
          in: header
          required: true
          schema:
            type: string
            example: "16"
        - name: dateFrom
          description:
            Fecha de inicio que se usará para filtrar la información. / Start
            date that will be used to filter the information.
          in: query
          required: true
          schema:
            type: string
            pattern: YYYY-MM-DD
            example: 2021-09-20
        - name: dateTo
          description:
            Fecha de fin que se usará para filtrar la información. / End date
            that will be used to filter the information.
          in: query
          required: true
          schema:
            type: string
            pattern: YYYY-MM-DD
            example: 2021-09-22
        - name: status
          description: Estatus de las citas. / Appointment status.
          in: query
          required: false
          schema:
            type: string
            example: PENDING
      responses:
        "200":
          description: Solicitud completada de forma satisfactoria. / Successful request.
          content:
            application/json:
              examples:
                Citas:
                  value:
                    success: true
                    message: null
                    data:
                      - appointmentId: "639503"
                        orderId: null
                        status: PENDING
                        clientId: "738949"
                        firstName: Ricardo
                        lastName: Gamboa Torres
                        address: Av de los Insurgente 6400, Colonia del Valle, CDMX, CP 03100
                        mainPhone: "5534456006"
