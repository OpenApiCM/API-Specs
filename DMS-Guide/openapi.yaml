            description: Precio por unidad de hora de mano de obra. / Price per hour.
            type: number
          discount:
            description: Descuento asignado a la parte / Part's discount
          comments:
            description:
              Comentarios adicionales sobre la parte. / Additional comments of
              the part.
            type: string
          customizableFields:
            $ref: "#/components/schemas/customizableFields"
    labors:
      description:
        Listado de manos de obras que se aplicarán en el trabajo. / List of
        labors that will be made in the job.
      type: array
      items:
        type: object
        required:
          - laborName
          - laborId
          - laborHours
          - laborHourPrice
        properties:
          laborName:
            description: Nombre de la mano de obra. / Labor name.
            type: string
          laborId:
            description:
              Identificador único de la mano de obra. / Labor's unique
              identifier.
            type: string
          laborHours:
            description:
              Cantidad de horas cotizadas para trabajar en la mano de obra./
              Hours worked.
            type: number
          laborHourPrice:
            description: Precio por unidad de hora de mano de obra. / Price per hour.
            type: number
          discount:
            description: Descuento asignado a la parte / Part's discount
          comments:
            description: Comentarios sobre la mano de obra./ Comments about the labor.
            type: string
    customizableFields:
      type: array
      description: Campos personalizables asociados a la OR, cliente final y vehículo.
      items:
        type: object
        properties:
          type:
            type: string
            description: Tipo de campo personalizado.
            example: FreeText | Numeric | Time | Date | Currency | Select | MultiSelect
          name:
            type: string
            description: Nombre del campo personalizado.
            example: Campo de texto libre
          value:
            oneOf:
              - type: string
              - type: number
              - type: object
                description: Objeto de Select y Multi Select
                properties:
                  name:
                    type: string
                    description: Nombre de la opción seleccionada
                    example: Premium
                  id:
                    type: string
                    description: ID asignado a la opción
                    example: P
              - type: array
                items:
                  type: object
                  description: Objeto de Select y Multi Select
                  properties:
                    name:
                      type: string
                      description: Nombre de la opción seleccionada
                      example: Premium
                    id:
                      type: string
                      description: ID asignado a la opción
                      example: P
            description: Valor del campo personalizado.
