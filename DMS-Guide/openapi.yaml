              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    description:
                      Valor que indica si el llamado al recurso fue exitoso. / Field
                      that tells if a request was successful.
                    type: boolean
                  message:
                    description:
                      Proporciona una pequeña descripción cuando ocurre un error al
                      llamado del recurso, por lo regular el valor de este
                      parámetro es nulo si no ocurre algún error. / Error
                      message description, can be null if it was a successful
                      request.
                    type: string
                    nullable: true
                  data:
                    description:
                      Representa el conjunto de citas que cumplan con los criterios
                      proporcionados en cualquiera de los parámetros
                    type: array
                    items:
                      type: object
                      required:
                        - appointmentId
                        - status
                        - clientId
                        - firstName
                        - mobile
                        - serviceAdvisorId
                        - vin
                        - licensePlate
                        - date
                        - confirmed
                        - mainType
                        - appointmentsPersonId
                      properties:
                        appointmentId:
                          description: Identificador único de la cita
                          type: string
                        orderId:
                          description: Identificador único de la orden relacionada a la cita
                          type: string
                        status:
                          description: Estado en el que se encuentra la cita
                          type: string
                          example: PENDING, ARRIVE, NO SHOW, NO SETTLED
                        clientId:
                          description: Identificador único del cliente final relacionado a la cita
                          type: string
                        firstName:
                          description: Nombre del cliente final
                          type: string
                        lastName:
                          description: Apellido del cliente final
                          type: string
                        address:
                          description: Dirección del cliente final
                          type: string
                        mainPhone:
                          description: Número telefónico del cliente final
                          type: string
                        secondaryPhone:
                          description: Número alternativo del cliente final
                          type: string
                        mobile:
                          description: Número celular del cliente final
                          type: string
                        email:
                          description: Correo electrónico del cliente final
                          type: string
                        serviceAdvisorId:
                          description: Identificador único del Asesor de Servicio relacionado a la cita
                          type: string
                        vin:
                          description: Número de Identificación del Vehículo relacionado a la cita
                          type: string
                        licensePlate:
                          description: Placas del vehículo relacionado a la cita
                          type: string
                        brand:
                          description: Marca del vehículo relacionado a la cita
                          type: string
                        model:
                          description: Modelo del vehículo relacionado a la cita
                          type: string
                        year:
                          description: Año del vehículo relacionado a la cita
                          type: string
                        date:
                          description: Fecha y hora de la cita
                          type: string
                          format: date-time
                          pattern: yyyy-MM-ddThh:mm:ss.000.000Z
                        promisedDate:
                          description: Fecha y hora promesa de entrega del vehículo
                          type: string
                          format: date-time
                          pattern: yyyy-MM-ddThh:mm:ss.000.000Z
                        confirmed:
                          description: Indica si la cita se confirmó con el cliente final.
                          type: boolean
                        socialName:
                          description: Razón social del cliente final
                          type: string
                        comments:
                          description:
                            Observaciones de la cita o información adicional del vehículo,
                            distintos comentarios deben ir separados por comas.
                          type: string
                        preOrderId:
                          description:
                            Identificador único de la pre orden relacionado a la cita, si y
                            solo si la agencia maneja pre Órdenes
                          type: string
                        orderTypeId:
                          description: Identificador único del tipo de orden relacionado a la cita
                          type: string
                        orderType:
                          description: Tipo de orden relacionado a la cita
                          type: string
                        serviceType:
                          description: Tipo de servicio relacionado a la cita
                          type: string
                        mainType:
                          description:
                            Valor que indica cuál es el trabajo principal que se le hará al
                            vehículo.
                          type: string
                          example: Mantenimiento 10,000 KM
                        withValetService:
                          description: Indica si la cita cuenta con servicio de valet a domicilio. / Indicates if an appointment has valet service.
                          type: boolean
                        appointmentsPersonId:
                          description: Identificador único de la persona que agendó la cita.
                          type: string
                          example: 167
        "400":
          description:
            Error de solicitud incorrecta. Hay un error de sintaxis por parte
            del cliente. / Failed request. There is a syntax error on the client
            side.
          content:
            application/json:
              example:
                success: false
                message:
                  "El servidor no puede entender la solicitud debido a un error de
                  sintaxis del lado del cliente, faltan los parámetros: xxxxx,
                  yyyyy, zzzzz. / There is a client side syntax error. The
                  following paramters are missing: xxxxx, yyyyy, zzzzz."
                data: []
              schema:
                description: ""
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    description:
                      Valor que indica si el llamado al recurso fue exitoso. / Field
                      that tells if the request was successful.
                    type: boolean
                  message:
                    description:
                      Proporciona una pequeña descripción del error que hubo al momento
                      de la ejecución del recurso. / Provides an error
                      description.
                    type: string
                  data:
                    description:
                      Arreglo que no contiene datos debido a que hubo un error al momento
                      de la ejecución del recurso. / Empty array due to a failed
                      request.
                    type: array
                    items:
                      type: string
                    minItems: 0
                    maxItems: 0
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - Appointments
      summary: Crea una cita. / Creates an appointment.
      operationId: createAppointment
      description:
        Crea una cita de acuerdo a los valores del cuerpo de la llamada. /
        Creates an appointment according to the data of the body.
      parameters:
        - name: organizationId
          description:
            Identificador único de la agencia o taller de la cual se quiere
            obtener la información. / Unique identifier of the dealership or
            workshop.
          in: header
          required: true
          schema:
            type: string
            example: "16"
      requestBody:
        description:
          Cuerpo que ClearMechanic envía para la creación de una cita. / Body that
          needs to be sent to create an appointment.
        required: true
        content:
          application/json:
            examples:
              Cita con motivos de visita generales:
                value:
                  firstName: Teresa de Jesús
                  lastName: Shen
                  email: teresa.shen@clearcheck.us
                  mobile: "9988117515"
                  taxId: TEJU850403PSS
                  model: Civic
                  brand: Honda
                  year: "2019"
                  vin: 12345ABCDE12FR45H
                  licensePlate: abc1234
                  color: Blanco
                  duration: 50
                  startDate: 2023-02-23T15:00:00.000Z
                  endDate: 2025-02-15T21:00:00,
                  deliveryDate: 2023-02-24T12:00:00.000Z
                  observations: Weird noice when starting the engine.
                  serviceAdvisorId: ABC1234
                  # dmsServiceAdvisorId: ABC123
                  # dmsAppointmentPersonId: CDE456
                  # cmosServiceAdvisorId: 0f35579f-d1c2-4862-8673-c6fb88f60c39
                  # cmosAppointmentPersonId: 364dd4c4-02cb-4145-90d7-c936bb6971e4
                  withValetService: true
