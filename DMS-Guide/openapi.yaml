                      noteType: ForCustomer
                    - textNote: Revisar suspensión delantera derecha
                      isFromCustomer: false
                      noteType: ForInternal
            
            schema:
              type: object
              required:
                - appointmentNumber
                - firstName
                - mobile
                - startDate
              properties:
                firstName:
                  description: Nombre del cliente final. / Final customer's name.
                  type: string
                lastName:
                  description: Apellido del cliente final. / Final customer's last name.
                  type: string
                email:
                  description: Correo electrónico del cliente final. / Final customer's email.
