components:
  responses:
    "400":
      description:
        Error de solicitud incorrecta. Hay un error de sintaxis por parte
        del cliente. / Failed request. There is a syntax error on the client
        side.
      content:
        application/json:
          example:
            success: false
            message:
              "El servidor no puede entender la solicitud debido a un error de
              sintaxis del lado del cliente, faltan los parámetros: xxxxx,
              yyyyy, zzzzz. / There is a client side syntax error. The following
              paramters are missing: xxxxx, yyyyy, zzzzz."
            data: []
          schema:
            $ref: "#/components/schemas/error"
    "404":
      description:
        No se encontró una coincidencia con los parámetros de búsqueda. /
        No match found for that resource.
      content:
        application/json:
          example:
            success: false
            message:
              No se encontraron datos que cumplan con los criterios proporcionados a
              través de los parámetros. / There was no match for the resource
              you're looking for.
            data: []
          schema:
            $ref: "#/components/schemas/error"
    "500":
      description: Error interno del servidor. / Internal server error.
      content:
        application/json:
          example:
            success: false
            message: Error interno del servidor. / Internal server error.
            data: []
          schema:
            $ref: "#/components/schemas/error"
  schemas:
    error:
      description: ""
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          description:
            Valor que indica si el llamado al recurso fue exitoso. / Field
            that tells if the request was successful.
          type: boolean
        message:
          description:
            Proporciona una pequeña descripción del error que hubo al momento
            de la ejecución del recurso. / Provides an error description.
          type: string
        data:
          description:
            Arreglo que no contiene datos debido a que hubo un error al momento
            de la ejecución del recurso. / Empty array due to a failed request.
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 0
