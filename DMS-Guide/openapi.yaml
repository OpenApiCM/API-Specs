                    Número de identificación fiscal del cliente final. / Final
                    customer's tax identification number.
                  type: string
                model:
                  description: Modelo del vehículo. / Vehicle's model.
                  type: string
                brand:
                  description: Marca del vehículo. / Vehicle's brand (make)
                  type: string
                year:
                  description: Año del vehículo. / Vehicle's year.
                  type: string
                vin:
