                  type: string
                  format: date-time
                  example: "2025-09-25T17:00:00Z"
                assignedUserId:
                  description: ID del usuario asignado (GUID). Opcional. / Assigned user ID (GUID). Optional.
                  type: string
                  format: GUID
                  example: "123e4567-e89b-12d3-a456-426614174000"
                associatedVehicleId:
                  description: ID del vehículo asociado (GUID). Opcional. / Associated vehicle ID (GUID). Optional.
                  type: string
                  format: GUID
                  example: "987f6543-21cb-4d56-8901-abcdef123456"
                associatedCustomerId:
                  description: ID del cliente asociado (GUID). Opcional. / Associated customer ID (GUID). Optional.
                  type: string
                  format: GUID
                  example: "321cba98-7654-4321-8901-fedcba654321"
                taskPriorityId:
                  description: ID de la prioridad (GUID). Opcional. / Priority ID (GUID). Optional.
                  type: string
                  format: GUID
                  example: "11111111-2222-3333-4444-555555555555"
                taskTypeId:
