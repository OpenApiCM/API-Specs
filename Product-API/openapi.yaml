                  taskTypeId: "22222222-3333-4444-5555-666666666666"
                  taskPurposeId: "33333333-4444-5555-6666-777777777777"
                  extraContext: "Customer requested follow-up after recent service"
            schema:
              type: object
              properties:
                description:
                  description: Descripción breve de la tarea (string). Opcional. / Brief description of the task (string). Optional.
                  type: string
                  example: "Call the customer to confirm if they were satisfied with the service."
