    VehicleIdPath:
      name: vehicleId
      description: Identificador único de un vehículo en el tablero del taller o
        agencia en ClearMechanic. / Vehicle unique identifier in the
        workshop or dealership ClearMechanic dashboard.
      in: path
      required: true
      schema:
        type: string
        example: 72984JSR-BA29-1234-F74D-01AA081KALSO
    ServiceAdvisorIdPath:
      name: serviceAdvisorId
      description: Identificador único del Asesor de Servicio en el tablero del taller
        o agencia en ClearMechanic. / Service Advisor unique identifier in
        the workshop or dealership ClearMechanic dashboard.
      in: path
      required: true
      schema:
        type: string
        format: GUID
        example: 9B12ND83-BA29-1234-F74D-06ASD97WE8QS
    DateRequiredQuery:
      name: date
      in: query
      required: true
      description: Fecha que se usará para filtrar la información. / Date that will be
        used to filter the information.
      schema:
        type: string
        format: date
        pattern: ^\d{4}-\d{2}-\d{2}$
        example: 2023-02-25
    UserNameQuery:
      name: userName
      description: Nombre del usuario / User name
      in: query
      required: false
      schema:
        type: string
        example: Eulalio
    RoleQuery:
      name: role
      description: Rol del usuario / User role. Administrator|Owner|Manager|WorkshopManager|Parts|ServiceAdvisor|Technician|CarWasher|BdcAdvisor|BdcSupervisor|Other
      in: query
      required: false
      schema:
        type: string
        example: ServiceAdvisor
    CellPhoneQuery:
      name: cellPhone
      description: Celular del usuario / User cell phone
      in: query
      required: false
      schema:
        type: string
        example: 3311445566
    IsActiveQuery:
      name: isActive
      description: Si el usuario está activo / If the user is active
      in: query
      required: false
      schema:
        type: boolean
        example: true
    JobIdPath:
      name: jobId
      description: Identificador único del trabajo en el tablero del
        taller o agencia en ClearMechanic. / Job unique identifier
        in the workshop or dealership ClearMechanic dashboard.
      in: path
      required: true
      schema:
        type: string
        example: "fe883e44-17b5-4526-b31d-232670232f1c"
    ApiKeyQuery:
      name: apiKey
      description: Parámetro de autenticación de la agencia o taller proporcionado por
        ClearMechanic. / Authentication parameter of the dealership or
        workshop provided by ClearMechanic.
      in: query
      required: true
      schema:
        type: string
        example: 2e55diu1-8572-406d-a3fc-197e2244e653
    IsEnterpriseQuery:
      name: isEnterprise
      in: query
      required: false
      description: Indica si la consulta debe realizarse en múltiples
        agencias o talleres. / It refers to whether the request must be
        carried out in multiple dealerships or workshops.
      schema:
        type: boolean
        example: true
    CreationSourceQuery:
      name: creationSource
      in: query
      required: false
      description: Fuente de donde se creó la Cita. / Appointment creation source.
      schema:
        type: string
        example: WebDashboard, OpenApi, AppointmentSite
    PageNumberQuery:
      name: pageNumber
      in: query
      required: false
      description: Número de página que se usará para paginar la información. / Page
        number that will be used to paginate the information.
      schema:
        type: integer
        example: 1
    CustomerLastNameQuery:
      name: customerLastName
      in: query
      required: false
      description: Apellido del cliente asociado a la OR. / Customer last name.
      schema:
        type: string
        example: Carlos
    TeamMemberIdQuery:
      name: teamMemberId
      in: query
      required: false
      description: ID interno del miembro del equipo asignado. / Assigned team memeber ID.
      schema:
        type: string
        format: GUID
        example: ef3641e1-37ea-43c7-907d-cbb9098a1c0c
    BusinessNameQuery:
      name: businessName
      in: query
      required: false
      description: Nombre fiscal del cliente final / Final customer business name.
      schema:
        type: string
        example: Carlos Gómez Pérez
    IdentificationNumberQuery:
      name: identificationNumber
      in: query
      required: false
      description: Número de identificación fiscal del cliente final / Final customer legal identification number.
      schema:
        type: string
        example: GOPC920515R32
  schemas:
    ApiResponseListJobs:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Job'
    Job:
      type: object
      properties:
        jobId:
          description: Identificador único del trabajo creado en CM. / Unique job identifier created in CM.
          type: string
          format: GUID
        dmsAssignedEmployeeId:
          description: Identificador externo del técnico asignado por el software de terceros. / 3rd party software identifier for the assigned technician.
          type: string
        cmosAssignedEmployeeId:
          description: Identificador del técnico asignado en el sistema CM. / CM identifier for the assigned technician.
          type: string
          format: GUID
        startDateTime:
          description: Fecha y hora de inicio planificada para el trabajo. / Planned start date and time for the job.
          type: string
          format: date-time
        orderNumber:
          description: Número de la Orden de Reparación asociada. / Associated Repair Order number.
          type: string
        appointmentNumber:
          description: Número de la cita asociada. / Associated appointment number.
          type: string
          nullable: true
        duration:
          description: Duración estimada del trabajo en formato HH:MM:SS. / Estimated job duration in HH:MM:SS format.
          type: string
          example: "00:45:00"
        planningId:
          description: Identificador de planificación en CM. / Planning identifier in CM.
          type: integer
        status:
          description: Estatus actual del trabajo. / Current status of the job.
          type: string
        action:
          description: Última acción ejecutada sobre el trabajo. / Last action performed on the job.
          type: string
        jobDescriptions:
          type: array
          items:
            type: object
            properties:
              inspectionItemDescriptions:
                type: string
        customizableFields:
          $ref: '#/components/schemas/customizableFields'
        standardOperations:
          $ref: '#/components/schemas/StandardOperation'
    customizableFields:
      type: array
      description: Campos personalizables asociados a la OR, cliente y vehículo. / Customizable fields associated with the RO, customer and vehicle.
      items:
        type: object
        properties:
          type:
            type: string
            description: Tipo de campo personalizado. / Custom field type.
            example: FreeText | Numeric | Time | Date | Currency | Select | MultiSelect
          fieldSection:
            type: string
            description: Sección en ClearMechanic donde debe ir el campo personalizable. / ClearMechanic section where the custom field belongs.
            example: WebCustomerInfo | WebVehicleInfo | WebOrderInfo
          name:
            type: string
            description: Nombre del campo personalizado. / Custom field name.
            example: Campo de texto libre
          value:
            oneOf:
              - type: string
              - type: number
              - type: object
                description: Objeto de Select y Multi Select. / Select and Multi Select object.
                properties:
                  name:
                    type: string
                    description: Nombre de la opción seleccionada. / Selected option name.
                    example: Premium
                  id:
                    type: string
                    description: ID asignado a la opción. / Option ID.
                    example: P
              - type: array
                items:
                  type: object
                  description: Objeto de Select y Multi Select. / Select and Multi Select object.
                  properties:
                    name:
                      type: string
                      description: Nombre de la opción seleccionada. / Selected option name.
                      example: Premium
                    id:
                      type: string
                      description: ID asignado a la opción. / Option ID.
                      example: P
            description: Valor del campo personalizado. / Custom field value.
    StandardOperation:
      type: object
      properties:
        operationCode:
          type: string
          description: El código único de la operación. / The unique code for the operation.
          example: "MTTO-01"
        standardTime:
          type: integer
          description: El tiempo estándar en minutos para completar la operación. / The standard time in minutes to complete the operation.
          example: 60
        operationCodeDescription:
          type: string
          description: La descripción de lo que implica la operación. / The description of what the operation entails.
          example: "Rectificar discos"
    InspectionItem:
      description: Representa los Puntos de Inspección que se van a cotizar en la
        Orden de Reparación. / Estimate information of the Repair
        Order inspection items.
      type: array
      items:
        required:
          - name
          - externalInspectionItemId
        properties:
          inspectionItemName:
            description: Nombre del punto de inspección. / Inspection Item name.
            type: string
          externalInspectionitemId:
            description: Identificador único del punto de inspección en el sistema de
              cotizaciones externo. / Inspection item unique
              identifier in the external system master library.
            type: string
          quantity:
            description: Cantidad de artículos que se necesitan de este punto de inspección.
              / Required quantity of the Inspection
          partUnitPrice:
            description: Precio por unidad del artículo en el punto de inspección. / Price
              per unit of the inspection item.
            type: number
          availability:
            description: Cantidad disponible en el inventario del sistema de cotizaciones
              externo. / Availability in stock.
            type: number
          laborHours:
            description: Cantidad de horas cotizadas para trabajar en la mano de obra del
              punto de inspección. / Quoted hours on the inspection
              item.
            type: number
          laborHourPrice:
            description: Precio por unidad de hora de mano de obra del punto de inspección.
              / Price per hour worked.
            type: number
          inspectionItemComments:
            description: Comentarios adicionales del técnico sobre el punto de inspección.
              Cada comentario adicional debe estar separado por una
              coma. / Additional technician comments. Any additional
              comment should be separated by a comma.
            type: string
          comments:
            description: Comentarios adicionales sobre el punto de inspección. Cada
              comentario adicional debe estar separado por una coma
              ','/ Additional comments. Any additional comment
              should be separated by a comma ','
            type: string
          approvalStatus:
            description: "Estatus en el que se encuentra el punto de inspección con respecto
              a la aprobación del cliente final. Los estatus
              disponibles son 'Pending', 'Approved' y 'Rejected' /
              Status of the inspection item regarding the client
              decision, the possible statuses are: 'Pending',
              'Approved', 'Rejected'"
            type: string
            example: Approved Rejected Pending
          priority:
            description: "Prioridad del punto de inspección. Los valores posibles son 'NA',
              'Urgent', 'Med' y 'Low'. / Inspection item priority.
              The possible values are: 'NA', 'Urgent', 'Med', and
              'Low'."
            type: string
            example: Urgent
          jobs:
            $ref: '#/components/schemas/EstimateJob'
          parts:
            $ref: '#/components/schemas/Parts'
          labors:
            $ref: '#/components/schemas/Labors'
    EstimateJob:
      description: Listado de los trabajos con los que cuenta el punto de inspección.
        Un punto de inspección puede o no tener trabajos. /
        Job list of the inspection item. An inspection item
        can have 0 or many sub-items.
      type: array
      items:
        required:
          - jobName
          - externalPartId
        properties:
          jobName:
            description: Nombre del trabajo. / Job name.
            type: string
          externalJobId:
            description: Identificador único del trabajo en el sistema de cotizaciones
              externo. / Job unique identifier on the
              external system.
            type: string
          comments:
            description: Comentarios adicionales sobre el sub punto. Cada comentario
              adicional debe estar separado por una coma ','/
              Additional comments of the sub-item. Any
              additional comment should be separated by a
              comma ','
            type: string
          parts:
            $ref: '#/components/schemas/Parts'
          Labors:
            $ref: '#/components/schemas/Labors'
    Parts: 
      description: Listado de partes / Part list
      type: array
      items:
        type: object
        required:
          - partName
          - partId
        properties:
          cmosEstimateId:
            description: Identificador único de la parte o mano de obra en CM. / Part or
              labor unique identifier in CM.
            type: number
          partName:
            description: Nombre de la parte. / Part name.
            type: string
          partId:
            description: Identificador único de la parte. / Part unique identifier.
            type: string
          quantity:
            description: Cantidad disponible en el inventario del sistema de cotizaciones
              externo. / Required quantity of the sub item.
            type: number
          partUnitPrice:
            description: Precio por unidad del artículo del sub punto. / Price per unit of
              the sub item
            type: number
          availability:
            description: Cantidad disponible en el inventario del sistema de cotizaciones
              externo. / Availability on stock.
            type: number
          laborHours:
            description: Cantidad de horas cotizadas para trabajar en la mano de obra del
              Punto de Inspección./ Quoted hours on the sub
              item.
            type: number
          laborHourPrice:
            description: Precio por unidad de hora de mano de obra del sub punto. / Price
              per hour.
            type: number
          discount:
            description: Descuento aplicado a la parte. / Discount applied to part
            type: number
          comments:
            description: Comentarios sobre la parte. Los comentarios deben ir separados por
              una coma./ Comments about the part. Comments
              must be divided by commas.
            type: string
    Labors:
      description: Listado de manos de obra que se aplicarán en el trabajo. / List of
        labors that will be made in the job.
      type: array
      items:
        type: object
        required:
          - laborName
          - laborId
        properties:
          cmosEstimateId:
            description: Identificador único de la parte o mano de obra en CM. / Part or
              labor unique identifier in CM.
            type: number
          laborName:
            description: Nombre de la mano de obra. / Labor name.
            type: string
          laborId:
            description: Identificador único de la mano de obra. / Labor unique
              identifier.
            type: string
          laborHours:
            description: Cantidad de horas cotizadas para trabajar en la mano de obra del
              Punto de Inspección./ Quoted hours on the sub
              item.
            type: number
          laborHourPrice:
            description: Precio por unidad de hora de mano de obra del sub punto. / Price
              per hour.
            type: number
          comments:
            description: Comentarios sobre la parte. Los comentarios deben ir separados por
              una coma./ Comments about the part. Comments
              must be divided by commas.
            type: string
    ApiError:
      type: object
      required:
        - success
        - message
      properties:
        success:
          description: Valor que indica que el llamado al recurso no fue exitoso. / Field that tells if the request was not successful.
          type: boolean
          example: false
        message:
          description: Proporciona una pequeña descripción del error. / Provides a brief error description.
          type: string
        data:
          description: Arreglo vacío debido a que hubo un error. / Empty array due to an error.
          type: array
          items: {}
          maxItems: 0
    ApiResponse:
      type: object
      required:
        - success
      properties:
        success:
          description: Indica si la solicitud fue exitosa. / Indicates if the request was successful.
          type: boolean
        message:
          description: Mensaje descriptivo. Puede ser nulo si no hay errores. / Descriptive message. Can be null if there are no errors.
          type: string
          nullable: true
    Order:
      description: Representa una Orden de Reparación en ClearMechanic. / Represents a Repair Order in ClearMechanic.
      type: object
      required:
        - orderNumber
      properties:
        orderNumber:
          description: Número de Orden de Reparación en ClearMechanic. / Repair Order number on ClearMechanic.
          type: string
          example: "101920201716"
        appointmentNumber:
          description: Número de cita asociada a la orden. / Appointment number associated with the order.
          type: string
          example: "AP001"
        firstName:
          description: Nombre del cliente final. / Final customer name.
          type: string
          example: Teresa de Jesús
        lastName:
          description: Apellido del cliente final. / Final customer last name.
          type: string
          example: Shen
        email:
          description: Correo electrónico del cliente final. / Final customer email.
          type: string
          format: email
          example: teresa.shen@clearcheck.us
        mobile:
          description: Teléfono celular del cliente final. / Final customer mobile phone.
          type: string
          pattern: "[0-9]*10"
          example: "9988117515"
        mainPhone:
          description: Teléfono fijo del cliente final. / Final customer landline.
          type: string
          pattern: "[0-9]*10"
          example: "3314156263"
        brand:
          description: Marca del vehículo relacionado con la Orden de Reparación. / Vehicle brand (make).
          type: string
          example: Honda
        model:
          description: Modelo del vehículo relacionado con la Orden de Reparación. / Vehicle model.
          type: string
          example: Civic
        year:
          description: Año del vehículo relacionado con la Orden de Reparación. / Vehicle year.
          type: string
          example: "2019"
        kilometers:
          description: Kilometraje del vehículo. / Vehicle mileage.
          type: string
          example: "12500"
        vin:
          description: Número de identificación del vehículo. / Vehicle identification number.
          type: string
          pattern: "[A-Z0-9]*17"
          example: 12345ABCDE12FR45H
        licensePlate:
          description: Placas del vehículo relacionado con la Orden de Reparación. / Vehicle license plates.
          type: string
          example: ABC1234
        tower:
          description: Número del cono u objeto puesto sobre cada vehículo en el que se trabaja. / Cone number assigned to the vehicle in the workshop.
          type: string
          example: "012"
        utsSold:
          description: Unidades de tiempo vendidas (UTS). / Unit time sold.
          type: string
          example: "30.5"
        orderType:
          description: Tipo de Orden de Reparación. / Repair Order type.
          type: string
          example: Warranty
        businessName:
          description: Nombre fiscal del cliente final. / Business name.
          type: string
          example: ClearMechanic
        documentType:
          description: Tipo de documento de identificación del cliente final. / Final customer identification document type.
          type: string
          example: RFC
        identificationNumber:
          description: Número de documento de identificación del cliente final. / Final customer identification document number.
          type: string
          example: "123456789"
        paymentMethod:
          description: Método de pago. / Payment method.
          type: string
          enum:
            - NA
            - Cash
            - CreditOrDebitCard
            - Check
            - WireTransfer
          example: Cash
        phase:
          description: ID numérico de la etapa de la Orden de Reparación. / Repair Order phase integer id.
          type: integer
          example: 1786
        inCharge:
          description: Identificador externo del responsable de la Orden de Reparación (dmsNumberId). / External id of the person in charge of the Repair Order (dmsNumberId).
          type: string
          example: JD123
        assignedTo:
          description: Identificador externo del técnico asignado a la Orden de Reparación. / Technician external ID assigned to the Repair Order.
          type: string
          example: DJ456
        notes:
          description: Notas adicionales relacionadas con la Orden de Reparación. / Additional notes related to the Repair Order.
          type: string
          example: Please check the brakes system.
        promisedDate:
          description: Fecha prometida de entrega de la Orden de Reparación. / Repair Order promised delivery date.
          type: string
          format: date-time
          example: "2023-10-20T17:30:00Z"
        inspectionItems:
          $ref: '#/components/schemas/InspectionItem'
        customizableFields:
          $ref: '#/components/schemas/customizableFields'
    PostAppointmentsV2RequestBody:
      type: object
      required:
        - customer
        - vehicle
        - startDate
      properties:
        appointmentNumber:
          description: Número de cita manual o externo (opcional). / Manual or external appointment number (optional).
          type: string
        customer:
          $ref: '#/components/schemas/AppointmentCustomerRequest'
        vehicle:
          $ref: '#/components/schemas/AppointmentVehicleRequest'
        duration:
          description: Duración estimada del servicio en minutos. / Estimated service duration in minutes.
          type: integer
          format: int32
        startDate:
          description: Fecha y hora programada para el inicio. / Scheduled start date and time.
          type: string
          format: date-time
        deliveryDate:
          description: Fecha y hora estimada de entrega. / Estimated delivery date and time.
          type: string
          format: date-time
        observations:
          description: Comentarios u observaciones adicionales para la cita. / Additional comments or observations for the appointment.
          type: string
        sendReminder:
          description: Indica si se debe disparar un recordatorio al cliente. / Indicates whether a reminder should be triggered for the customer.
          type: boolean
        serviceAdvisorId:
          description: Identificador único del asesor de servicio (GUID). Si se incluye, tomará precedencia sobre serviceAdvisorExternalId / Unique identifier of the service advisor (GUID). If included it will take precedence over serviceAdvisorExternalId
          type: string
          format: GUID
        serviceAdvisorExternalId:
          description: Identificador externo del asesor de servicio, puede ser usado en lugar de serviceAdvisorId. / Service advisor external Id, can be used instead of serviceAdvisorId.
          type: string
        technicianId:
          description: Identificador único del técnico (GUID). Si se incluye, tomará precedencia sobre technicianExternalId / Unique identifier of the technician (GUID). If included it will take precedence over technicianExternalId
          type: string
          format: GUID
        technicianExternalId:
          description: Identificador externo del técnico, puede ser usado en lugar de technicianId. / Service technician external Id, can be used instead of technicianId.
          type: string
        userWhoScheduleId:
          description: Identificador del usuario que crea la cita (GUID). Si se incluye, tomará precedencia sobre userWhoScheduleExternalId/ Identifier of the user creating the appointment (GUID). If included it will take precedence over userWhoScheduleExternalId
          type: string
          format: GUID
        userWhoScheduleExternalId:
          description: Identificador externo del usuario que crea la cita, puede ser usado en lugar de userWhoScheduleId. / External ID of the user that created the appointment, can be used instead of userWhoScheduleId.
          type: string
        withValetService:
          description: Define si el cliente requiere servicio de Valet. / Defines if the customer requires Valet service.
          type: boolean
        mobilityOptionId:
          description: Identificador de la opción de movilidad elegida. / Identifier for the chosen mobility option.
          type: integer
      oneOf:
        - required: [appointmentReasons]
          properties:
            appointmentReasons:
              description: Lista de razones de cita predefinidas. / List of predefined appointment reasons.
              type: array
              items:
                $ref: '#/components/schemas/AppointmentReasonRequest'
        - required: [customReasons]
          properties:
            customReasons:
              description: Lista de razones personalizadas por el taller. / List of workshop-specific custom reasons.
              type: array
              items:
                $ref: '#/components/schemas/CustomReasonRequest'
    AppointmentCustomerRequest:
      type: object
      required:
        - firstName
        - mobile
      properties:
        firstName:
          description: Nombre del cliente. / Customer first name.
          type: string
        lastName:
          description: Apellido del cliente. / Customer last name.
          type: string
        mobile:
          description: Número de contacto móvil. / Mobile contact number.
          type: string
        email:
          description: Correo electrónico de contacto. / Contact email address.
          type: string
          format: email
    AppointmentVehicleRequest:
      type: object
      description: >-
        El VIN es obligatorio; si falta, se requiere Placa + Marca + Modelo. / 
        VIN is required; if missing, then licensePlate + brand + model are required.
      properties:
        vin:
          description: Número de serie del vehículo (VIN). / Vehicle Identification Number (VIN).
          type: string
        licensePlate:
          description: Número de placa. / License plate number.
          type: string
        brand:
          description: Marca del vehículo. / Vehicle brand.
          type: string
        model:
          description: Modelo del vehículo. / Vehicle model.
          type: string
        year:
          description: Año del vehículo. / Vehicle year.
          type: string
        color:
          description: Color del vehículo. / Vehicle color.
          type: string
      # Lógica de validación solicitada
      anyOf:
        - required: [vin]
        - required: [licensePlate, brand, model]
    AppointmentReasonRequest:
      type: object
      required:
        - appointmentReason
      properties:
        appointmentReason:
          description: Nombre o descripción de la razón de cita estándar. / Standard appointment reason name or description.
          type: string
    CustomReasonRequest:
      type: object
      properties:
        customReasonId:
          description: ID de la razón personalizada (GUID). / Custom reason ID (GUID).
          type: string
          format: GUID
        customReasonExternalId:
          description:  ID externo de la razón personalizada. / Custom reason external ID.
          type: string
        customReasonDetailId:
          description: ID del detalle de la razón (puede ser nulo). / Reason detail ID (can be null).
          type: string
          nullable: true
        customReasonDetailExternalId:
