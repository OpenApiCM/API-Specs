            format: GUID
            example: 0198ecf0-1c02-74ab-96c7-612a69149722
        - $ref: '#/components/parameters/WorkshopIdQuery'
      requestBody:
        description: El cuerpo de la llamada estará en formato JSON con la siguiente estructura. Todos los campos son opcionales. / The body of the call will be in JSON format with the following structure. All fields are optional.
        required: true
