        mobile:
          type: string
          description: "Teléfono celular del cliente. / Customer mobile phone number."
          example: "5551234567"
        taxId:
          type: string
          description: "RFC del cliente; puede ser una cadena vacía. / Customer tax ID; may be an empty string."
          example: "GARC920205I3T"
 
        # Vehicle
        vehicleId:
          type: string
          format: uuid
          description: "Identificador del vehículo. / Vehicle ID."
          example: 80297a7c-5850-422a-875c-2f8b058961e9
        brand:
          type: string
          description: "Marca del vehículo. / Vehicle brand."
          example: GMC
        model:
          type: string
          description: "Modelo del vehículo. / Vehicle model."
          example: Acadia
        year:
          type: string
          pattern: '^\d{4}$'
          description: "Año del vehículo. / Vehicle year."
          example: "2025"
        vin:
          type: string
          description: "Número de identificación vehicular (VIN). / Vehicle identification number (VIN)."
          example: 1G1B790B89VL214
        licensePlate:
          type: string
          description: "Placas del vehículo. / Vehicle license plate."
          example: PAS1952
        color:
          type: string
          description: "Color del vehículo. / Vehicle color."
          example: Silver
 
        # Scheduling
        duration:
          type: integer
          description: "Duración de la cita en minutos. / Appointment duration in minutes."
          example: 30
        startDate:
          type: string
          description: "Fecha y hora de inicio de la cita. / Appointment start date and time."
          example: "2026-10-09T10:00:00"
        endDate:
          type: string
          description: "Fecha y hora de fin de la cita. / Appointment end date and time."
          example: "2026-10-09T10:30:00.000Z"
        deliveryDate:
          type: string
          description: "Fecha y hora de entrega del vehículo. / Vehicle delivery date and time."
          example: "2026-10-09T00:30:00"
        creationDate:
          type: string
          description: "Fecha de creación de la cita. / Appointment creation date."
          example: "2026-10-07T00:00:00"
        lastModificationDate:
          type: string
          format: date-time
          nullable: true
          description: "Fecha de la última modificación de la cita. / Date the appointment was last modified."
          example: null
        deletedAtDate:
          type: string
          format: date-time
          nullable: true
          description: "Fecha en que se eliminó la cita. / Date the appointment was deleted."
          example: null
 
        # Service details
        observations:
          type: string
          description: "Observaciones o comentarios sobre la cita. / Appointment notes or comments."
          example: Weird noice when starting the engine.
        serviceAdvisor:
          type: string
          description: "Nombre del asesor de servicio. / Service advisor name."
          example: Asesor Servicio 17
        serviceAdvisorId:
          type: string
          format: uuid
          description: "Identificador del asesor de servicio. / Service advisor ID."
          example: 1e36bb00-8a17-47a9-b80f-8827a5f4fb1a
        appointmentReasons:
          type: array
          description: "Motivos de la cita seleccionados del catálogo. / Appointment reasons selected from the catalog."
          items:
            $ref: '#/components/schemas/AppointmentReason'
        customReasons:
          type: array
          description: "Motivos personalizados de la cita. / Custom appointment reasons."
          items: {}
          example: []
        mobilityOptions:
          $ref: '#/components/schemas/MobilityOptions'
 
        # Metadata
        creationSource:
          type: string
          description: "Fuente desde la que se creó la cita. / Source the appointment was created from. Values: APPOINTMENT_SITE, OPEN_API, ENTERPRISE, WEB_DASHBOARD"
          example: OPEN_API
        orderNumber:
          type: string
          description: "Número de OR relacionado a la cita; puede ser una cadena vacía. / Related order number; may be an empty string."
          example: ""
        userWhoSchedule:
          type: string
          description: "Nombre del usuario que agendó la cita. / Name of the user who scheduled the appointment."
          example: Asesor Servicio 17
        userWhoScheduleId:
          type: string
          format: uuid
          description: "Identificador del usuario que agendó la cita. / ID of the user who scheduled the appointment."
          example: 1e36bb00-8a17-47a9-b80f-8827a5f4fb1a
        sendReminder:
          type: boolean
          description: "Indica si se debe enviar un recordatorio al cliente. / Whether a reminder should be sent to the customer."
          example: false
        isDeleted:
          type: boolean
          description: "Indica si la cita fue eliminada. / Whether the appointment was deleted."
          example: false
 
    AppointmentReason:
      type: object
      description: "Motivo de la cita. / Appointment reason."
      required:
        - appointmentReasonId
        - appointmentReason
      properties:
        appointmentReasonId:
          type: string
          format: uuid
          description: "Identificador del motivo de la cita. / Appointment reason ID."
          example: 01a010a1-af30-72a3-b9c7-92417c7f4290
        appointmentReason:
          type: string
          description: "Descripción del motivo de la cita. / Appointment reason description."
          example: Sonido raro al acelerar.
 
    MobilityOptions:
      type: object
      description: "Opción de movilidad para el cliente durante el servicio. / Customer mobility option during the service."
      required:
        - mobilityOptionId
        - title
      properties:
        mobilityOptionId:
          type: integer
          description: "Identificador de la opción de movilidad; -1 indica sin movilidad. / Mobility option ID; -1 means no mobility."
          example: -1
        title:
          type: string
          description: "Título de la opción de movilidad. / Mobility option title."
          example: withoutMobility
        description:
          type: string
          nullable: true
          description: "Descripción de la opción de movilidad. / Mobility option description."
          example: null
    VehicleBaseResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          description: Valor que indica que el llamado al recurso fue exitoso. / Field
            that tells if a request was successful.
          type: boolean
        message:
          description: Proporciona una pequeña descripción cuando ocurre un error al
            llamado del recurso, por lo regular el valor de este
            parámetro es nulo si no ocurre algún error. / Error
            message description, can be null if it was a successful
            request.
          type: string
          nullable: true
        data:
          type: object
          required:
            - vehicleId
            - customerId
            - vin
          properties:
            vehicleId:
              description: Identificador único del vehículo en CM. / Vehicle unique
                identifier in CM.
              type: string
              format: GUID
            customerId:
              description: Identificador único del cliente final que tiene el vehículo, en
                CM. / Final customer unique identifier in CM.
              type: string
              format: GUID
            vin:
              description: Número de identificación del vehículo. / Vehicle identification
                number.
              type: string
              format: "[A-Z, 0-9]*17"
            licensePlate:
              description: Placas del vehículo. / Vehicle license plates.
              type: string
            brand:
              description: Marca del vehículo. / Vehicle brand (make)
              type: string
            model:
              description: Modelo del vehículo. / Vehicle model.
              type: string
            year:
              description: Año del vehículo. / Vehicle year.
              type: string
            color:
              description: Color del vehículo. / Vehicle color.
              type: string