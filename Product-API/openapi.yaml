          application/json:
            examples:
              Actualización de tarea:
                value:
                  description: "Call the customer to confirm if they were satisfied with the service."
                  dueDate: "2025-09-25T17:00:00Z"
                  assignedUserId: "123e4567-e89b-12d3-a456-426614174000"
